name: Run Sarkari Job Bot

on:
  schedule:
    # Runs every 6 hours (4 times a day automatically)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually anytime you want

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python main.py
